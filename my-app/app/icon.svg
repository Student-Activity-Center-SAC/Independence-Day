<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Saffron top band -->
  <rect x="0" y="0" width="32" height="10" fill="#FF9933"/>
  <!-- White middle band -->
  <rect x="0" y="10" width="32" height="12" fill="#FFFFFF"/>
  <!-- Green bottom band -->
  <rect x="0" y="22" width="32" height="10" fill="#138808"/>

  <!-- Ashoka Chakra — bold, thick strokes, visible at all sizes -->
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="5.2" fill="none" stroke="#000080" stroke-width="1.4"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.1" fill="#000080"/>
  <!-- 8 main spokes (thick) — cardinal + diagonal -->
  <g stroke="#000080" stroke-width="1.1" stroke-linecap="round">
    <line x1="16" y1="11.2" x2="16" y2="10.1"/>
    <line x1="16" y1="20.8" x2="16" y2="21.9"/>
    <line x1="11.2" y1="16" x2="10.1" y2="16"/>
    <line x1="20.8" y1="16" x2="21.9" y2="16"/>
    <line x1="12.52" y1="12.52" x2="11.67" y2="11.67"/>
    <line x1="19.48" y1="19.48" x2="20.33" y2="20.33"/>
    <line x1="19.48" y1="12.52" x2="20.33" y2="11.67"/>
    <line x1="12.52" y1="19.48" x2="11.67" y2="20.33"/>
  </g>
  <!-- 16 thinner spokes (between the main ones) -->
  <g stroke="#000080" stroke-width="0.65" stroke-linecap="round">
    <line x1="16" y1="10.8" x2="14.37" y2="10.22"/>
    <line x1="16" y1="10.8" x2="17.63" y2="10.22"/>
    <line x1="21.78" y1="14.37" x2="21.2" y2="16"/>
    <line x1="21.78" y1="17.63" x2="21.2" y2="16"/>
    <line x1="16" y1="21.2" x2="14.37" y2="21.78"/>
    <line x1="16" y1="21.2" x2="17.63" y2="21.78"/>
    <line x1="10.22" y1="14.37" x2="10.8" y2="16"/>
    <line x1="10.22" y1="17.63" x2="10.8" y2="16"/>
    <line x1="12.52" y1="10.93" x2="11.37" y2="12.52"/>
    <line x1="19.48" y1="10.93" x2="20.63" y2="12.52"/>
    <line x1="21.07" y1="19.48" x2="19.48" y2="20.63"/>
    <line x1="10.93" y1="19.48" x2="12.52" y2="20.63"/>
    <line x1="10.93" y1="12.52" x2="12.52" y2="10.93"/>
    <line x1="21.07" y1="12.52" x2="19.48" y2="10.93"/>
    <line x1="19.48" y1="21.07" x2="21.07" y2="19.48"/>
    <line x1="12.52" y1="21.07" x2="10.93" y2="19.48"/>
  </g>
</svg>
